name: Validate student distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned lab and validation packages
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -r requirements-torch.txt
      - name: Validate notebooks and smoke-test scaffolding
        run: |
          python check_environment.py
          python scripts/validate.py --smoke
